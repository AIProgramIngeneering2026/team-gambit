name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Извлечь репозиторий
        uses: actions/checkout@v4
      - name: Установить uv и Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Установить зависимости
        run: uv sync --locked
      - name: Запустить проверки
        run: scripts/harness/check.sh
