        status_history:
          - {from_state: null, to_state: created, at: '2026-11-14T10:00:00Z', actor: user, reason: null}
          - {from_state: created, to_state: queued, at: '2026-11-14T10:00:00Z', actor: user, reason: null}
          - {from_state: queued, to_state: running, at: '2026-11-14T10:00:01Z', actor: worker, reason: null}
    JobFailedWorkerLost:
      summary: Worker перезапустился во время выполнения
      value:
        id: 8f1c2d3e-4a5b-4c6d-8e7f-9a0b1c2d3e4f
