        created_at: '2026-11-14T11:00:00Z'
        started_at: null
        finished_at: null
        status_history:
          - {from_state: null, to_state: created, at: '2026-11-14T11:00:00Z', actor: user, reason: null}
          - {from_state: created, to_state: queued, at: '2026-11-14T11:00:00Z', actor: user, reason: null}
    SignalBuy:
      summary: Пересечение SMA снизу вверх
      value:
        ticker: EXMPL
