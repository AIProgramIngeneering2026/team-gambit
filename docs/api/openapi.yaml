        started_at: '2026-11-14T10:00:01Z'
        finished_at: '2026-11-14T10:00:03Z'
        status_history:
          - {from_state: null, to_state: created, at: '2026-11-14T10:00:00Z', actor: user, reason: null}
          - {from_state: created, to_state: queued, at: '2026-11-14T10:00:00Z', actor: user, reason: null}
          - {from_state: queued, to_state: running, at: '2026-11-14T10:00:01Z', actor: worker, reason: null}
          - {from_state: running, to_state: canceled, at: '2026-11-14T10:00:03Z', actor: user, reason: null}
    JobRerunQueued:
      summary: Повторный запуск завершённого задания на его снимке
      value:
        id: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
